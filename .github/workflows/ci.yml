# CI 护栏：typecheck + vitest + vite build；Rust 侧仅在 src-tauri 变更时跑 cargo test。
# 迭代六 C1（ROADMAP P3-2）。
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    name: cargo test
    runs-on: ubuntu-latest
    needs: web
    # 只在 Rust 侧代码变更时运行（轻量 PR 免全量编译）
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.files.*.path, 'src-tauri/') ||
      contains(github.event.pull_request.files.*.path, 'Cargo.')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml
