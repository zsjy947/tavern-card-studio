# 发布流水线：打 tag v* 触发 Windows 构建（tauri-action），产物进草稿 release + workflow artifact。
# 不自动发正式 release：人工检查草稿后发布。迭代六 C1。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Tauri build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: '请在Assets下载对应安装包，校验无误后手动发布本 Release。'
          releaseDraft: true
          prerelease: false
      # 草稿 release 之外再收一份 workflow artifact（collect-release.mjs 只做产物收集，不触发构建）
      - name: Collect artifacts
        run: node scripts/collect-release.mjs
      # 便携版随 release 一并附上：zip 内仅单文件 exe（WebView2 为系统组件），
      # 发布草稿时即与安装包同出。此前 v1.0.0 为人工附加，此步自动化。
      - name: Upload portable bundle
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $zip = "release/tavern-card-studio_${version}_x64-portable.zip"
          Compress-Archive -Path "release/portable/tavern-card-studio.exe" -DestinationPath $zip -Force
          gh release upload "$env:GITHUB_REF_NAME" $zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn
